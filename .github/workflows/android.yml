name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests de la logique (planification, minuterie, états)
        run: ./gradlew :core:test --console=plain

      - name: Compilation de l'application Android (APK de démonstration)
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: marine-routine-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publier les résultats de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: core/build/reports/tests/test/
          if-no-files-found: ignore
