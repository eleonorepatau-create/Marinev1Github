<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marine — Routine du matin</title><style>:root{font-family:system-ui,sans-serif;color:#263449;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:560px;margin:auto;padding:18px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}.card{background:white;border-radius:22px;padding:22px;margin:15px 0;box-shadow:0 5px 24px #1e335016}button,input{font:inherit}button{border:0;border-radius:16px;padding:16px;cursor:pointer;font-weight:700}button:focus-visible,input:focus-visible{outline:3px solid #234cbb;outline-offset:3px}.primary{background:#287e66;color:white}.help{background:#fff0d8;color:#6a4300}.secondary{background:#e8eef8;color:#273e69}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}h1{font-size:1.45rem}h2{font-size:1.3rem}.symbol{font-size:82px;text-align:center;margin:15px}.task{text-align:center;font-size:1.8rem;font-weight:800}.hint{text-align:center;color:#59677a}.progress{height:18px;background:#e9edf4;border-radius:12px;overflow:hidden}.bar{height:100%;background:#47a68a;transition:width .3s}.big{width:100%;min-height:70px;font-size:1.2rem;margin:6px 0}.hidden{display:none}label{display:block;margin:12px 0;font-weight:600}input{width:100%;padding:12px;border:1px solid #aebaca;border-radius:10px;margin-top:5px}small{color:#58667a}.item{border-bottom:1px solid #e7eaf0;padding:12px 0}.status{padding:12px;border-radius:12px;background:#eef4ff;margin-top:12px}nav button{padding:12px} .done{color:#24785d}</style></head><body><main><header><h1>🌤️ Bonjour Marine</h1><nav class="row"><button class="secondary" onclick="mode('marine')">Marine</button><button class="secondary" onclick="mode('parent')">Parent</button></nav></header><section id="marine"><div class="card"><p class="hint" id="counter"></p><div class="symbol" id="symbol">☀️</div><div class="task" id="task"></div><p class="hint" id="instruction"></p><div class="progress" aria-label="Progression de la routine"><div class="bar" id="bar"></div></div><p class="hint" id="progressText"></p><button class="secondary big" onclick="speak()">🔊 Écouter la consigne</button><button class="primary big" onclick="finish()">✓ J'ai terminé</button><button class="help big" onclick="askHelp()">✋ J'ai besoin d'aide</button><div class="status" id="marineStatus" role="status">Tu peux avancer à ton rythme.</div></div></section><section id="parent" class="hidden"><div class="card"><h2>Paramétrage de la routine</h2><p><small>Prototype local : les changements sont enregistrés uniquement sur cet appareil. Aucune alerte n'est envoyée à un autre téléphone.</small></p><div id="editor"></div><button class="secondary big" onclick="addTask()">+ Ajouter une activité</button><button class="primary big" onclick="save()">Enregistrer les changements</button><button class="secondary big" onclick="resetRoutine()">Recommencer la routine</button><div class="status" id="parentStatus" role="status">Aucune demande d'aide.</div></div></section></main><script>
const defaults=[{emoji:'🛏️',name:'Je me lève',instruction:'Bonjour Marine. C’est le moment de te lever.',time:'07:00'},{emoji:'🚿',name:'Je fais ma toilette',instruction:'Va dans la salle de bain et fais ta toilette.',time:'07:10'},{emoji:'👕',name:'Je m’habille',instruction:'Choisis tes vêtements et habille-toi.',time:'07:25'},{emoji:'🥣',name:'Je prends mon petit-déjeuner',instruction:'C’est le moment de prendre ton petit-déjeuner.',time:'07:40'},{emoji:'🪥',name:'Je me brosse les dents',instruction:'Brosse-toi les dents.',time:'08:00'},{emoji:'🎒',name:'Je prépare mes affaires',instruction:'Vérifie tes affaires avant de partir.',time:'08:10'}];
let tasks=JSON.parse(localStorage.getItem('marine_tasks')||'null')||defaults.map(x=>({...x}));let index=Number(localStorage.getItem('marine_index')||0);let help=localStorage.getItem('marine_help')||'';
function mode(m){document.getElementById('marine').classList.toggle('hidden',m!=='marine');document.getElementById('parent').classList.toggle('hidden',m!=='parent');if(m==='parent')editor();render()}
function render(){let finished=index>=tasks.length;document.getElementById('counter').textContent=finished?'Routine terminée':`Activité ${index+1} sur ${tasks.length}`;document.getElementById('symbol').textContent=finished?'🌟':tasks[index].emoji;document.getElementById('task').textContent=finished?'Bravo, tu as terminé !':tasks[index].name;document.getElementById('instruction').textContent=finished?'Toutes les activités sont confirmées.':tasks[index].instruction;document.getElementById('bar').style.width=(tasks.length?index/tasks.length*100:100)+'%';document.getElementById('progressText').textContent=`${index} activité(s) terminée(s) sur ${tasks.length}`;document.getElementById('parentStatus').textContent=help?'Demande d’aide (sur cet appareil) : '+help:'Aucune demande d’aide.';document.querySelectorAll('#marine button').forEach(b=>b.disabled=finished)}
function speak(){if(index>=tasks.length)return; if(!('speechSynthesis' in window)){document.getElementById('marineStatus').textContent='La lecture vocale n’est pas disponible sur ce navigateur.';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(tasks[index].instruction);u.lang='fr-FR';u.rate=.88;speechSynthesis.speak(u)}
function finish(){if(index>=tasks.length)return;index++;localStorage.setItem('marine_index',index);document.getElementById('marineStatus').textContent='Activité confirmée. Très bien !';render()}
function askHelp(){if(index>=tasks.length)return;help=tasks[index].name;localStorage.setItem('marine_help',help);document.getElementById('marineStatus').textContent='Ta demande d’aide est enregistrée sur cet appareil. Va voir ton parent si tu as besoin d’aide maintenant.';render()}
function editor(){let e=document.getElementById('editor');e.replaceChildren();tasks.forEach((t,i)=>{let div=document.createElement('div');div.className='item';div.innerHTML=`<strong>Activité ${i+1}</strong><label>Image / emoji<input data-i="${i}" data-k="emoji"></label><label>Nom<input data-i="${i}" data-k="name"></label><label>Consigne vocale<input data-i="${i}" data-k="instruction"></label><label>Horaire indicatif<input type="time" data-i="${i}" data-k="time"></label><button class="help" type="button" data-delete="${i}">Supprimer</button>`;e.appendChild(div);div.querySelectorAll('input').forEach(el=>{el.value=t[el.dataset.k];el.addEventListener('input',()=>{tasks[i][el.dataset.k]=el.value})});div.querySelector('button').onclick=()=>{tasks.splice(i,1);index=Math.min(index,tasks.length);editor()}})}
function addTask(){tasks.push({emoji:'⭐',name:'Nouvelle activité',instruction:'C’est le moment de faire cette activité.',time:'08:20'});editor()}
function save(){localStorage.setItem('marine_tasks',JSON.stringify(tasks));render();document.getElementById('parentStatus').textContent='Modifications enregistrées sur cet appareil.'}
function resetRoutine(){index=0;help='';localStorage.setItem('marine_index','0');localStorage.removeItem('marine_help');render()}
render();</script></body></html>
